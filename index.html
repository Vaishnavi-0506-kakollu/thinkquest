<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ThinkQuest</title>

<style>
body{
 margin:0;
 font-family:Arial;
 background:linear-gradient(270deg,#ff0080,#7928ca,#2afadf,#00ff87);
 background-size:600% 600%;
 animation:bg 6s infinite;
 text-align:center;
 color:white;
}
@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}
.card{
 background:white;
 color:black;
 width:85%;
 max-width:700px;
 margin:80px auto;
 padding:30px;
 border-radius:25px;
 box-shadow:0 15px 40px rgba(0,0,0,0.4);
}
button{
 width:100%;
 padding:16px;
 margin:8px 0;
 font-size:18px;
 border-radius:18px;
 border:none;
 background:linear-gradient(45deg,#ff0080,#7928ca);
 color:white;
 cursor:pointer;
}
button:hover{transform:scale(1.05);}
#points{
 position:fixed;
 top:15px;
 left:50%;
 transform:translateX(-50%);
 background:#ff9800;
 padding:12px 25px;
 border-radius:25px;
 font-size:22px;
 font-weight:bold;
}
</style>
</head>

<body>

<div id="points">⭐ Points: 0</div>
<div class="card" id="screen"></div>

<script>

let points=0;
let subject="",genre="",level="",qIndex=0;
let questions=[];

const stories={
 Aptitude:{
  Adventure:`
Arjun was a curious boy who loved exploring the jungle near his village. One morning, he found a hidden path filled with wooden bridges crossing deep rivers. Each bridge had numbers carved on stones.

The first bridge showed “3 + 5”. Arjun added carefully and got 8. The bridge slowly opened.

The second bridge showed “10 – 4”. Arjun subtracted and got 6. Again the bridge opened.

As he walked deeper, animals appeared to guide him. A monkey said, “If you double 6 quickly, what do you get?” Arjun thought fast and said 12.

A parrot showed him “4 × 5”. Arjun multiplied and answered 20.

Every step forward needed faster thinking. Soon the puzzles became harder. Some required combining addition and multiplication.

For example, a cave door showed “(2 + 3) × 4”. Arjun solved step by step and got 20.

As he continued, he realized mental shortcuts helped him reach faster.

Finally he reached a golden treasure chest that required solving 100 – 45.

When he answered 55, the chest opened.

Inside were books teaching speed math tricks.

Arjun realized aptitude was the real treasure that made life easier and faster.
`,

  Mystery:`
Riya lived in Mathville where strange number symbols started appearing on doors every night.

One door showed “7 + 6”. When Riya solved it as 13, the door opened.

Inside she found a map pointing to another house.

That house showed “20 – 8”. The answer 12 revealed another clue.

Every clue was hidden inside math problems.

Some were easy, like 4 + 4.

Some were tricky, like 6 × 7.

As she solved more, she noticed a pattern.

Each answer formed a sequence guiding her across town.

At the old clock tower she found a box with “(10 + 5) × 2”.

She carefully solved it to get 30.

Inside was a final map leading underground.

The underground vault required “100 ÷ 4”.

She answered 25.

The vault opened revealing gold coins and books of mathematical mysteries.

Riya learned that solving problems patiently uncovers hidden opportunities.
`,

  Fantasy:`
Leo lived in a magical kingdom where numbers floated in the sky.

Gates opened only when correct calculations were spoken.

The first gate said “5 + 3”.

Leo shouted 8 and the gate sparkled open.

Dragons guarded castles that displayed puzzles like “9 × 3”.

Leo answered 27 and the dragon stepped aside.

Wizards trained Leo using fast calculations.

They showed him “20 – 7”, “6 × 5”, “45 ÷ 9”.

Each correct answer increased his magic strength.

One giant gate showed a big spell:

“(4 + 6) × 5 – 10”.

Leo solved slowly and got 40.

The kingdom celebrated his intelligence.

He realized math was the true magic power.
`
 },

 Reasoning:{
  Adventure:`
Maya arrived on an island where paths split in many directions.

Each path had symbols and patterns.

One sign showed 2, 4, 6, ?  

She noticed the numbers increased by 2 and chose 8.

The correct path opened.

Another path showed animals: cat, dog, cow, ?

She thought and picked another animal like horse.

Wrong paths closed automatically.

Some paths showed shapes repeating in patterns.

Others showed odd one out puzzles.

Maya had to think logically.

Slowly she reached the mountain top where the crystal of wisdom was hidden.

The final gate showed:

1, 4, 9, 16, ?

Maya recognized squares and answered 25.

The crystal glowed and she became wiser.

She learned reasoning helps choose correct paths in life.
`,

  Mystery:`
Aarav found an old library with books that whispered riddles.

One riddle said:

“What comes after A, C, E?”

He answered G.

A bookshelf moved.

Another riddle showed:

Apple, Banana, Carrot, ?

He realized carrot was different and chose it.

Each solved riddle opened secret rooms.

Some puzzles used number patterns.

Others used logic.

At the final door the riddle said:

“Which does not belong: square, circle, triangle, red?”

Aarav chose red.

The treasure room opened.

Inside were books of knowledge.

He understood reasoning unlocks hidden doors of wisdom.
`,

  Fantasy:`
Princess Anya ruled a kingdom attacked by shadow creatures.

To defeat them she had to solve thinking spells.

One spell showed:

3, 6, 9, ?

She answered 12.

Another spell showed:

Sun, Moon, Star, ?

She said Sky.

Each correct answer weakened shadows.

Some spells required identifying odd items.

Others required predicting sequences.

The final shadow showed:

1, 1, 2, 3, 5, ?

Anya answered 8.

The shadow vanished forever.

Her kingdom was saved by intelligence.

She learned reasoning is the strongest magic.
`
 }
};

},

}

};


const screen=document.getElementById("screen");

function updatePoints(){
 document.getElementById("points").innerText="⭐ Points: "+points;
}

function home(){
 screen.innerHTML=`
 <h2>Select Subject</h2>
 <button onclick="chooseSub('Aptitude')">📐 Aptitude</button>
 <button onclick="chooseSub('Reasoning')">🧠 Reasoning</button>
 `;
}

function chooseSub(s){subject=s;genreScreen();}

function genreScreen(){
 screen.innerHTML="<h2>Select Genre</h2>";
 ["Adventure","Mystery","Fantasy"].forEach(g=>{
  screen.innerHTML+=`<button onclick="chooseGenre('${g}')">${g}</button>`;
 });
}

function chooseGenre(g){genre=g;storyScreen();}

function storyScreen(){
 screen.innerHTML=`<h2>${genre} Story</h2><p>${stories[subject][genre]}</p>
 <button onclick="levelScreen()">Go to Levels</button>`;
}

function levelScreen(){
 screen.innerHTML=`<h2>Select Level</h2>
 <button onclick="startQuiz('Easy')">Easy</button>
 <button onclick="startQuiz('Medium')">Medium</button>
 <button onclick="startQuiz('Hard')">Hard</button>`;

}

function startQuiz(lvl){
 level=lvl;qIndex=0;
 questions=questionBank[subject][genre][level];
 showQuestion();
}

function showQuestion(){
 if(qIndex>=questions.length){
  screen.innerHTML=`<h2>🎉 Completed!</h2><button onclick="home()">Home</button>`;
  return;
 }
 let q=questions[qIndex];
 screen.innerHTML=`<h3>${level} Question ${qIndex+1}</h3><p>${q.q}</p>`;
 q.opts.forEach(o=>{
  screen.innerHTML+=`<button onclick="checkAnswer('${o}')">${o}</button>`;
 });
 screen.innerHTML+=`<button onclick="buyHint()">💡 Buy Hint (-5)</button>`;
}

function buyHint(){
 if(points<5){alert("Not enough points");return;}
 points-=5;updatePoints();
 alert("Hint: "+questions[qIndex].hint);
}

function checkAnswer(a){
 if(a===questions[qIndex].ans){points+=10;updatePoints();}
 qIndex++;setTimeout(showQuestion,300);
}

home();

</script>
</body>
</html>
